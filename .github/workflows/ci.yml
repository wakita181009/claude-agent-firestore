name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, latest]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint & Format
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Start Firestore emulator
        run: |
          npm install -g firebase-tools
          echo '{"emulators":{"firestore":{"port":8080,"host":"localhost"}}}' > firebase.json
          firebase emulators:start --only firestore --project test-project &
          timeout 30 bash -c 'until curl -sf http://localhost:8080 >/dev/null 2>&1; do sleep 1; done'

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
