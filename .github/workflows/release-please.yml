name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR / GitHub Release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: pnpm install --frozen-lockfile
      - name: Lint & Format
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Start Firestore emulator
        run: |
          npm install -g firebase-tools
          echo '{"emulators":{"firestore":{"port":8080,"host":"localhost"}}}' > firebase.json
          firebase emulators:start --only firestore --project test-project &
          timeout 30 bash -c 'until curl -sf http://localhost:8080 >/dev/null 2>&1; do sleep 1; done'
      - name: Test
        run: pnpm test
      - name: Publish to npm
        run: pnpm --filter claude-agent-firestore publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
