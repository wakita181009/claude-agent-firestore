version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@google-cloud/firestore"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
